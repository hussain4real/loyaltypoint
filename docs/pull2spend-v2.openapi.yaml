      operationId: revokeConnection
      summary: Revoke future partner access
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned. Revocation immediately blocks new access/redemption and triggers protected token disposal
        under approved retention. Existing committed obligations continue controlled completion/recovery and are
        not discarded.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '202':
          description: Durably accepted or awaiting an authoritative outcome. Pending/unknown is not financial completion.
            Poll the returned owned operation; do not blindly resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOperation'
          headers:
            Location:
              description: Owned operation or resource status URI under /api/v2.
              schema:
                type: string
                format: uri-reference
      parameters:
      - $ref: '#/components/parameters/connection_reference'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyActionRequest'
  /connections/{connection_reference}/refresh:
    post:
      operationId: refreshConnection
      summary: Refresh one owned balance
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned. Current consent, source availability and partner rate limits apply. Preserve the last
        successful snapshot on failure; never overwrite it with zero or derive an absent monetary estimate.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '202':
          description: Durably accepted or awaiting an authoritative outcome. Pending/unknown is not financial completion.
            Poll the returned owned operation; do not blindly resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOperation'
          headers:
            Location:
              description: Owned operation or resource status URI under /api/v2.
              schema:
                type: string
                format: uri-reference
      parameters:
      - $ref: '#/components/parameters/connection_reference'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyActionRequest'
  /connections/refresh:
    post:
      operationId: refreshConnections
      summary: Refresh selected or all owned connections
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
