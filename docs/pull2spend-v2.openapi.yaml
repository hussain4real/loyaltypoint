openapi: 3.1.0
info:
  title: Pull2Spend consumer and foundation API contracts
  version: 0.1.0
  description: Phase 1 design baseline for technical and accountable-owner review. Every consumer operation is explicitly
    planned and is not a registered application route. Only POST /api/v2/foundation/callbacks/{source} is implemented
    as a disabled-by-default local/testing simulator protocol. Existing /api/v1 behavior remains separate. The authenticated
    consumer identity is never accepted as request data; all resources are ownership-scoped before lookup/list/filter.
    Current eligibility, consent and step-up are checked at mutation time. Planned contracts define behavior without
    approving legal/issuer/funding/commercial/retention policies. No automatic FX, point-to-money conversion, cash
    deposit or P2P behavior is introduced. Back-office HTML/session/MFA/internal service contracts are documented
    in PULL2SPEND_PHASE1_FOUNDATIONS.md; this spec does not invent staff JSON routes.
servers:
- url: /api/v2
  description: Version boundary only. Planned routes are absent until their later implementation phase.
security:
- ConsumerBearer: []
tags:
- name: Identity
- name: Connections
- name: Redemptions
- name: Operations
- name: Wallet
- name: Cards
- name: Cases
- name: Foundation callbacks
x-decision-gates:
  funding_and_issuer:
  - OD-02
  - OD-11
  - OD-12
  partner_recovery:
  - OD-04
  - OD-09
  commercial_and_currency:
  - OD-03
  - OD-06
  - OD-07
  - OD-08
  scope_membership_and_policy:
  - OD-05
  - OD-10
  - OD-13
  - OD-15
  - OD-16
x-financial-invariants:
- Partner supplies points quantity and equivalent monetary amount/currency; no conversion rules are requested or
  calculated.
- Quote/approval snapshots bind confirmed partner terms and approved commercial versions. Any offered value change,
  including an increase, requires renewed consumer approval.
- Currency mismatch blocks commitment until an explicitly approved design; no automatic FX.
- Pending/unknown external outcomes retain stable operation references and recovery ownership. Timeout is not proof
  of no debit.
- Point-funding obligations, platform fee and Merchant Revenue Share incentive are separately recorded.
- Financial completion requires confirmed partner legs, approved funding and balanced immutable monetary postings;
  notifications are independent.
paths:
  /eligibility:
    get:
      operationId: getEligibility
      summary: Read current consumer eligibility
      tags:
      - Identity
      x-implementation-status: planned
      description: Planned read-only eligibility decision. The backend derives identity from the authenticated token.
        Allowed actions are informative and must be checked again at mutation time.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eligibility'
  /partners:
    get:
      operationId: listPartners
      summary: List supported Loyalty Partners
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
        and current eligibility apply.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPage'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /connections:
    get:
      operationId: listConnections
      summary: List owned connections
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
        and current eligibility apply.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: connectPartner
      summary: Start consented partner connection
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned. Requires current connection eligibility and configured step-up. Captures approved consent,
        creates one durable connection intent and returns an allowlisted partner-hosted handoff. Backend-verifiable
        callback and ownership evidence are required before connected state. Membership multiplicity follows OD-13,
        with no implicit policy default.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '202':
          description: Durably accepted or awaiting an authoritative outcome. Pending/unknown is not financial completion.
            Poll the returned owned operation; do not blindly resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOperation'
          headers:
            Location:
              description: Owned operation or resource status URI under /api/v2.
              schema:
                type: string
                format: uri-reference
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
  /connections/{connection_reference}:
    get:
      operationId: getConnection
      summary: Read an owned connection
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
