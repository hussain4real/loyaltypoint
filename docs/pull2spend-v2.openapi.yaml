  /wallet:
    get:
      operationId: getWallet
      summary: Read funded wallet availability
      tags:
      - Wallet
      x-implementation-status: planned
      description: Planned. Approved enrollment and current financial eligibility apply. Posted balance, authorization
        holds, restricted value, pending redemption and available-to-spend remain separate. Safeguarding/issuer
