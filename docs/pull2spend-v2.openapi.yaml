          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '202':
          description: Durably accepted or awaiting an authoritative outcome. Pending/unknown is not financial completion.
            Poll the returned owned operation; do not blindly resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
            Location:
              description: Owned operation or resource status URI under /api/v2.
              schema:
                type: string
                format: uri-reference
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
