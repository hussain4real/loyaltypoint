openapi: 3.1.0
info:
  title: Pull2Spend consumer and foundation API contracts
  version: 0.3.1
  description: Phase 2 identity implementation and later-phase design contracts. Each operation declares its delivery status. Consumer identity admission is disabled by default. The user approved policy baseline P2-KYC-2026-10-28-v1 and Regula/Mesh recommendations. Licensed verification is deferred to a required pre-launch milestone; the real adapter remains unavailable. All-clear observations require an examiner recommendation and a different checker before approval. Local verification fixtures are never financial authority. Existing V1 legacy point behavior remains separate, with pending V2 activation denied through V1 login. Later financial, hosting and operating decisions remain gated. No point conversion or automatic FX is introduced.
servers:
- url: /api/v2
  description: V2 boundary. Planned routes remain absent; implemented identity admission is controlled by configuration.
security:
- ConsumerBearer: []
tags:
- name: Identity
- name: Connections
- name: Redemptions
- name: Operations
- name: Wallet
- name: Cards
- name: Cases
- name: Foundation callbacks
x-decision-gates:
  funding_and_issuer:
  - OD-02
  - OD-11
  - OD-12
  partner_recovery:
  - OD-04
  - OD-09
  commercial_and_currency:
  - OD-03
  - OD-06
  - OD-07
  - OD-08
  scope_membership_and_policy:
  - OD-05
  - OD-10
  - OD-13
  - OD-15
  - OD-16
x-financial-invariants:
- Partner supplies points quantity and equivalent monetary amount/currency; no conversion rules are requested or
  calculated.
- Quote/approval snapshots bind confirmed partner terms and approved commercial versions. Any offered value change,
  including an increase, requires renewed consumer approval.
- Currency mismatch blocks commitment until an explicitly approved design; no automatic FX.
- Pending/unknown external outcomes retain stable operation references and recovery ownership. Timeout is not proof
  of no debit.
- Point-funding obligations, platform fee and Merchant Revenue Share incentive are separately recorded.
- Financial completion requires confirmed partner legs, approved funding and balanced immutable monetary postings;
  notifications are independent.
paths:
  /eligibility:
    get:
      operationId: getEligibility
      summary: Read current consumer eligibility
      tags:
      - Identity
      x-implementation-status: implemented-disabled-by-default
      description: Implemented consumer identity route. Admission is disabled by default. Ownership and current
        session/device state are checked; provider and policy gates remain separate.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Current owned result. No financial completion is implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eligibility'
        '423':
          description: Session is locked. Use the allowed password unlock flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeError'
  /partners:
    get:
      operationId: listPartners
      summary: List supported Loyalty Partners
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
        and current eligibility apply.
