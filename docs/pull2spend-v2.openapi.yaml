              $ref: '#/components/schemas/RefreshAllRequest'
  /connections/{connection_reference}/balance:
    get:
      operationId: getConnectionBalance
      summary: Read the last owned partner observation
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned. Read-only cached snapshot; observed time, currency, source, optional validity and freshness
        remain visible. Stale/offline data is not executable approval. Access before full KYC requires an explicitly
        enabled release decision.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSnapshot'
