          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteApproval'
      parameters:
      - $ref: '#/components/parameters/quote_reference'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteApprovalRequest'
  /redemptions:
    post:
      operationId: confirmRedemption
      summary: Accept approved redemption for processing
      tags:
      - Redemptions
      x-implementation-status: planned
      description: Planned. No financial commitment without current authoritative accepted partner terms, valid
        owned quote/approval, eligibility/consent/limits/capacity and approved funding/accounting controls. Stable
        operation key prevents duplicate intent. All-or-nothing spendable credit across partners; unknown outcomes
        retain owned recovery/case references. No application transaction promises external atomicity.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '202':
          description: Durably accepted or awaiting an authoritative outcome. Pending/unknown is not financial completion.
            Poll the returned owned operation; do not blindly resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
