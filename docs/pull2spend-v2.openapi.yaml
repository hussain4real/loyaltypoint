          - type: 'null'
      required:
      - data
      - next_cursor
      description: Stable cursor order; the server scopes records before pagination. Page size is policy/configuration,
        with no fixed default in this contract.
    RedemptionPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
        next_cursor:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - data
      - next_cursor
      description: Stable cursor order; the server scopes records before pagination. Page size is policy/configuration,
        with no fixed default in this contract.
    StatementPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        next_cursor:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - data
      - next_cursor
      description: Stable cursor order; the server scopes records before pagination. Page size is policy/configuration,
        with no fixed default in this contract.
    CardPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        next_cursor:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - data
      - next_cursor
      description: Stable cursor order; the server scopes records before pagination. Page size is policy/configuration,
        with no fixed default in this contract.
    CasePage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Case'
        next_cursor:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - data
      - next_cursor
      description: Stable cursor order; the server scopes records before pagination. Page size is policy/configuration,
        with no fixed default in this contract.
    RefreshBatch:
      type: object
      additionalProperties: false
      properties:
        operation:
          $ref: '#/components/schemas/Operation'
        connections:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              connection_reference:
                $ref: '#/components/schemas/Reference'
              operation_reference:
                $ref: '#/components/schemas/Reference'
            required:
            - connection_reference
            - operation_reference
      required:
      - operation
      - connections
      description: Isolated child refresh operations. One partner failure does not erase other snapshots or produce
        zero balances.
    ResourceReference:
      type: string
      minLength: 1
      maxLength: 180
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$(?![\s\S])
      description: Opaque case-sensitive URI path reference. Source/account evidence containing slash remains an
        ordinary Reference in JSON, not a resource path segment.
    ContactInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: email
        value:
          type: string
          format: email
          maxLength: 255
      required:
      - kind
      - value
      description: Implemented consumer contact channel is email. Phone registration/delivery requires a selected
        verified channel and an explicit later contract; no fabricated email is assigned.
    RegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        contact:
          $ref: '#/components/schemas/ContactInput'
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        password_confirmation:
          type: string
          writeOnly: true
        terms_version:
          $ref: '#/components/schemas/Reference'
        privacy_notice_version:
          $ref: '#/components/schemas/Reference'
      required:
      - contact
      - display_name
      - password
      - password_confirmation
      - terms_version
      - privacy_notice_version
      description: Email registration intent. Pending credentials are encrypted; no User, session, KYC or financial
        authority exists before valid contact proof. Configured current notice versions are required. Duplicate
        existing accounts receive the same public challenge shape without credential replacement. Phone delivery
        is not enabled.
    Challenge:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        purpose:
          type: string
          enum:
          - contact_verification
          - login
          - step_up
          - device_enrollment
        methods:
          type: array
          items:
            type: string
            enum:
            - verified_channel_otp
            - password
            - device_signature
          minItems: 1
          maxItems: 1
        expires_at:
          type: string
          format: date-time
        resend_after_seconds:
          type: integer
          minimum: 0
          maximum: 1800
          description: Server-directed wait after contact code issuance before another code may be requested. Present for contact verification challenges.
        next_action:
          type: string
        payload:
          type: object
          additionalProperties: false
          properties:
            message:
              type: string
              contentEncoding: base64
              description: Decode and sign these exact opaque server bytes. P256 ECDSA SHA256, DER signature, base64
                proof. Never independently reconstruct JSON.
          required:
          - message
      required:
      - reference
      - purpose
      - methods
      - expires_at
      - next_action
    ChallengeProof:
      type: object
      additionalProperties: false
      properties:
        challenge_reference:
          $ref: '#/components/schemas/Reference'
        method:
          type: string
          enum:
          - verified_channel_otp
          - password
          - device_signature
        proof:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - challenge_reference
      - method
      - proof
      description: The backend accepts only a method bound to the challenge and verifies its protocol/proof against
        server-held credentials. Device signature proof uses the registered key/attested protocol; biometrics unlock
        that device key locally. No raw biometric template is sent or persisted. Challenge limits/purpose/expiry/replay
        checks apply before session or evidence creation.
    LoginChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        contact:
          $ref: '#/components/schemas/ContactInput'
        device_reference:
          type:
          - string
          - 'null'
        method:
          type: string
          enum:
          - password
          - device_signature
      required:
      - contact
      - method
    Session:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          readOnly: true
        reference:
          $ref: '#/components/schemas/Reference'
        expires_at:
          type: string
          format: date-time
        device_reference:
          $ref: '#/components/schemas/Reference'
        locked:
          type: boolean
        assurance:
          type: string
          enum:
          - password
          - key_possession
      required:
      - access_token
      - reference
      - expires_at
      - device_reference
      - locked
      - assurance
      description: Issued once after a single-use login challenge. Stored hashed by Sanctum and protected on the
        device. Separate eligibility endpoint determines permitted actions; a session alone grants no financial
        eligibility.
    ContactVerification:
      type: object
      additionalProperties: false
      properties:
        verified:
          type: boolean
          const: true
        registration_reference:
          $ref: '#/components/schemas/Reference'
        next_action: *id002
      required:
      - verified
      - registration_reference
      - next_action
      description: Contact verification is not identity/KYC approval and creates no wallet or card.
    Profile:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        display_name: *id002
        verified_contacts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                - email
                - mobile
              masked_value: *id002
              verified_at: *id001
            required:
            - kind
            - masked_value
            - verified_at
        language: *id002
        notification_preferences:
          type: object
          additionalProperties: false
          properties:
            security: *id003
            redemption: *id003
            card_transactions: *id003
            point_expiry_reminders: *id003
          required:
          - security
          - redemption
          - card_transactions
          - point_expiry_reminders
        terms_version:
          $ref: '#/components/schemas/Reference'
        privacy_notice_version:
          $ref: '#/components/schemas/Reference'
      required:
      - reference
      - display_name
      - verified_contacts
      - language
      - notification_preferences
      - terms_version
      - privacy_notice_version
      description: Only the authenticated consumer's profile. Essential notices follow approved policy; preferences
        cannot suppress required financial/security obligations. Optional expiry reminders require actual supplied
        expiry data.
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
        language: *id002
        notification_preferences:
          type: object
          additionalProperties: false
          properties:
            security: *id003
            redemption: *id003
            card_transactions: *id003
            point_expiry_reminders: *id003
      description: No actor, role, KYC state, wallet balance or contact-verification flag can be changed here. Contact
        changes require their own fresh purpose-bound verification and configured step-up.
    IdentityUploadRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - identity_document
          - liveness_selfie
          - support_evidence
        media_type: *id002
        size_bytes:
          type: integer
          format: int64
          minimum: 1
      required:
      - kind
      - media_type
      - size_bytes
      description: Server validates permitted evidence types, size policy and authenticated ownership before issuing
        an allowlisted protected provider/storage handoff. Files require integrity/malware/provider verification
        and never enter audit payloads.
    IdentityUploadHandoff:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        upload_url:
          type: string
          format: uri
        expires_at: *id001
        required_headers:
          type: object
          additionalProperties:
            type: string
        completion_reference:
          $ref: '#/components/schemas/Reference'
      required:
      - reference
      - upload_url
      - expires_at
      - required_headers
      - completion_reference
      description: Short-lived owned upload capability for approved protected storage/provider. Treat URL/headers
        as sensitive transient data and never expose them in logs or back-office views. A successful upload alone
        is not verified identity evidence.
    EnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        identity_document_reference:
          $ref: '#/components/schemas/Reference'
        liveness_evidence_reference:
          $ref: '#/components/schemas/Reference'
        identity_details_reference:
          $ref: '#/components/schemas/Reference'
      required:
      - identity_document_reference
      - liveness_evidence_reference
      - identity_details_reference
      description: Owned protected provider evidence references, validated by the backend. identity_details_reference
        identifies the approved provider-collected identity form. No client KYC decision, sanctions result, account
        restriction or funding assertion is accepted.
    Enrollment:
      type: object
      additionalProperties: false
      properties:
        reference:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - not_started
          - pending
          - under_review
          - verified
          - rejected
          - reverification_required
        revision:
          type: integer
          minimum: 0
        provider_available:
          type: boolean
        policy_reference:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        next_action:
          type: string
        reason_codes:
          type: array
          items:
            type: string
      required:
      - reference
      - state
      - revision
      - provider_available
      - policy_reference
      - created_at
      - updated_at
      - verified_at
      - expires_at
      - next_action
      - reason_codes
      description: Consumer-safe own verification state. Document, liveness, identity and all screening checks
        are independent. Hits remain latched for scoped compliance review. No raw screening matches are exposed.
        Real provider capture/integration is pending selection.
    DeviceEnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        device_reference:
          $ref: '#/components/schemas/Reference'
        attestation_evidence_reference:
          $ref: '#/components/schemas/Reference'
        public_key_evidence_reference:
          $ref: '#/components/schemas/Reference'
      required:
      - device_reference
      - attestation_evidence_reference
      - public_key_evidence_reference
      description: References identify owned evidence from an approved attestation/key-registration protocol. The
        backend cryptographically verifies the protocol, challenge and key possession; opaque reference submission
        alone grants no trust. Private keys, biometric templates and secrets are excluded.
    Device:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        assurance:
          type: string
          enum:
          - password
          - key_possession
        revoked:
          type: boolean
        current:
          type: boolean
      required:
      - reference
      - assurance
    DevicePage:
      type: object
      additionalProperties: false
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
      required:
      - devices
    ConsentPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
        next_cursor:
          anyOf:
          - *id002
          - type: 'null'
      required:
      - data
      - next_cursor
    StepUpChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        action: *id002
        resource_reference:
          $ref: '#/components/schemas/Reference'
        device_reference:
          $ref: '#/components/schemas/Reference'
      required:
      - action
      - resource_reference
      - device_reference
      description: Action is allowlisted by server policy and bound to the owned resource and registered device/session.
        High-value redemption, new connections and sensitive card actions follow configured requirements, with no
        monetary threshold invented here.
    StepUpEvidence:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        action: *id002
        resource_reference:
          $ref: '#/components/schemas/Reference'
        device_reference:
          $ref: '#/components/schemas/Reference'
        verified_at: *id001
        expires_at: *id001
      required:
      - reference
      - action
      - resource_reference
      - device_reference
      - verified_at
      - expires_at
      description: Server-issued completed evidence. Mutations recheck scope, action, session/device, expiry and
        any single-use requirement. The client cannot mint evidence by changing a field.
    ConsumerSessionState:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        expires_at:
          type: string
          format: date-time
        device_reference:
          $ref: '#/components/schemas/Reference'
        locked:
          type: boolean
        assurance:
          type: string
          enum:
          - password
          - key_possession
      required:
      - reference
      - expires_at
      - device_reference
      - locked
      - assurance
      description: Current backend session state. Key possession is not hardware attestation. Inactivity, expiry,
        current contact and device/token revocation are checked by the server.
    DeviceKeyChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        public_key:
          type: string
          maxLength: 1024
          description: P256 prime256v1 DER SubjectPublicKeyInfo exported as PEM. Private keys and biometric templates
            never leave the device.
      required:
      - public_key
    DeviceKeyProof:
      type: object
      additionalProperties: false
      properties:
        challenge_reference:
          $ref: '#/components/schemas/Reference'
        proof:
          type: string
          contentEncoding: base64
          writeOnly: true
      required:
      - challenge_reference
      - proof
    ConsumerStepUpRequest:
      type: object
      additionalProperties: false
      properties:
        action_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        method:
          type: string
          enum:
          - password
          - device_signature
      required:
      - action_digest
      - method
    ConsumerStepUpEvidence:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        expires_at:
          type: string
          format: date-time
        action_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - reference
      - expires_at
      - action_digest
      description: Action-, device- and session-bound step-up evidence. Earlier evidence is invalidated on session
        lock, unlock, logout and device revocation.
    ConsumerPasswordProof:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          maxLength: 1024
          writeOnly: true
      required:
      - password
    ConsumerVerificationFixture:
      type: object
      additionalProperties: false
      properties:
        event_reference:
          $ref: '#/components/schemas/Reference'
        revision_reference:
          $ref: '#/components/schemas/Reference'
        operation_reference:
          $ref: '#/components/schemas/Reference'
        checks:
          type: object
          additionalProperties: false
          properties:
            document:
              type: string
              enum:
              - clear
              - hit
              - rejected
              - pending
            liveness:
              type: string
              enum:
              - clear
              - hit
              - rejected
              - pending
            identity:
              type: string
              enum:
              - clear
              - hit
              - rejected
              - pending
            sanctions:
              type: string
              enum:
              - clear
              - hit
              - rejected
              - pending
            pep:
              type: string
              enum:
              - clear
              - hit
              - rejected
              - pending
            adverse_media:
              type: string
              enum:
              - clear
              - hit
              - rejected
              - pending
          required:
          - document
          - liveness
          - identity
          - sanctions
          - pep
          - adverse_media
        occurred_at:
          type: string
          format: date-time
        evidence_reference:
          $ref: '#/components/schemas/Reference'
      required:
      - event_reference
      - revision_reference
      - operation_reference
      - checks
      - occurred_at
      - evidence_reference
    ConsumerCallbackReceipt:
      type: object
      additionalProperties: false
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        status:
          const: accepted
      required:
      - reference
      - status
  responses:
    Unauthenticated:
      description: Authentication is missing, expired or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
    Forbidden:
      description: Current eligibility, account restrictions, consent or required step-up denies the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
    NotFound:
      description: Reference is missing or belongs to another consumer. These outcomes are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
    Conflict:
      description: Immutable terms, operation key, current state or unresolved external outcome conflicts. Renew
        approval or query the original operation as indicated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
    ValidationError:
      description: Request fails schema or approved partner/business constraints; no input values are echoed.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/SafeError'
            - type: object
              additionalProperties: false
              properties:
                message:
                  type: string
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
              required:
              - message
              - errors
    Unavailable:
      description: A required capability, approved commercial/funding policy or external source is unavailable;
        no financial success is inferred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
    RateLimited:
      description: Rate limit exceeded. Retry according to the server header; retain the original operation key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
      headers:
        Retry-After:
          description: Server retry delay in seconds when supplied.
          schema:
            type: integer
            minimum: 0
