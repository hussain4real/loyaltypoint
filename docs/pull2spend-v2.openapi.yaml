        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPage'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /connections:
    get:
      operationId: listConnections
      summary: List owned connections
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
        and current eligibility apply.
