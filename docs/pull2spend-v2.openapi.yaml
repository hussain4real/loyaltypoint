              description: Owned operation or resource status URI under /api/v2.
              schema:
                type: string
                format: uri-reference
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionConfirmRequest'
    get:
      operationId: listRedemptions
      summary: List owned redemption history
      tags:
      - Redemptions
      x-implementation-status: planned
      description: Planned contract. This consumer route is not implemented in Phase 1. Authentication-derived ownership
        and current eligibility apply.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionPage'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/Until'
      - $ref: '#/components/parameters/PartnerFilter'
      - name: state
        in: query
        schema:
          type: string
          enum:
          - pending
          - processing
          - awaiting_partner
          - recovery_pending
          - completed
          - failed
