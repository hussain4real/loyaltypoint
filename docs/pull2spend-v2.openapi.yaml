  /foundation/callbacks/{source}:
    post:
      operationId: acceptFoundationCallback
      summary: Persist a verified development callback
      tags:
      - Foundation callbacks
      x-implementation-status: implemented-local-testing-only
      description: Implemented simulator protocol only in APP_ENV local/testing with callbacks enabled and a
        configured simulator source/key. Admission is disabled by default. Verify lowercase HMAC-SHA256(timestamp
        + "." + exact request bytes), key at least 32 bytes, timestamp skew within configured bound (current
        default 300 seconds), and body bytes within configured limit (current default 16384). Configuration errors
        fail closed. No real partner protocol or economic capability is certified. Duplicate callback identity
        remains durable; a fresh signature/timestamp is required on every delivery. Processing and recovery continue
        independently of new-admission flags.
      security:
      - CallbackSignature: []
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,64}$(?![\s\S])
      - name: X-Callback-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,11}$(?![\s\S])
        description: Unix seconds as decimal ASCII, signed with the exact body.
      - name: X-Callback-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$(?![\s\S])
        description: Lowercase hexadecimal HMAC-SHA256 of timestamp, period and exact body. Key remains in protected
          runtime configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackBody'
            example:
              event_id: event-123
              operation_reference: operation-456
              status: pending
              occurred_at: '2026-10-26T10:00:00Z'
      responses:
        '202':
          description: Encrypted normalized event persisted durably. Dispatch/worker/notification success is
            not required to acknowledge receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackReceipt'
        '401':
          description: Invalid signature/key/timestamp/size. No event persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackError'
        '409':
          description: Case-sensitive source/event identity already has a different canonical payload. Original
            retained and conflict audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackError'
        '422':
          description: Authenticated JSON fails strict schema/calendar validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackError'
        '429':
          description: Implemented throttle:60,1 middleware rejects excess requests; a deployment may apply stricter
            network limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkRateLimitError'
        '503':
          description: Admission disabled, unsupported source/environment, or invalid foundation configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackError'
        '423':
          description: Session is locked. Use the allowed password unlock flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeError'
