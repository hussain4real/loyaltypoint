      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              connections:
              - reference: connection-123
                points: 10000
  /redemption-quotes/{quote_reference}:
    get:
      operationId: getRedemptionQuote
      summary: Read immutable quote and fees
      tags:
      - Redemptions
      x-implementation-status: planned
      description: Planned. Ready quote includes each supplied value and validity, approved commercial versions,
        disclosed fees, total credit and completion window. Changed terms produce a new superseding quote. Illustrative
        monetary values and timestamps are not policy defaults.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Owned resource or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
      parameters:
      - $ref: '#/components/parameters/quote_reference'
  /redemption-quotes/{quote_reference}/approval:
    post:
      operationId: approveRedemptionQuote
      summary: Approve displayed immutable quote
      tags:
      - Redemptions
      x-implementation-status: planned
      description: Planned. Authenticated explicit consumer approval is bound to the stored displayed digest, exact
        sources/points/value/currency/references/validity, fees/credit and commercial versions. Current eligibility
        and completed step-up apply. Changed terms, even increased value, require a new displayed quote and renewed
        approval. The consumer cannot manufacture authoritative partner confirmation.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
