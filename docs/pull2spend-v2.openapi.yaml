  /redemption-quotes:
    post:
      operationId: createRedemptionQuote
      summary: Request confirmed supplied-value quote
      tags:
      - Redemptions
      x-implementation-status: planned
      description: Planned. Each owned selected connection is checked against current KYC/account/consent/limits/capacity.
        Every point owner supplies points and monetary value/currency. Quote preparation is asynchronous; only a
        ready owned quote with authoritative confirmation can be approved. Missing/zero/expired/unconfirmed terms
        or incompatible currencies block readiness. No conversion rate or automatic FX.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
