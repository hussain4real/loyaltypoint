      summary: Resume approved automatic virtual-card issuance
      tags:
      - Cards
      x-implementation-status: planned
      description: Planned. Approved enrollment creates one stable issuance intent automatically. This endpoint
        resumes that intent when allowed; repeated keys/callbacks cannot create duplicate active cards. Issuer program/KYC/funding
