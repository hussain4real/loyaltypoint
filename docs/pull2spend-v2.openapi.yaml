      - $ref: '#/components/parameters/Limit'
    post:
      operationId: connectPartner
      summary: Start consented partner connection
      tags:
      - Connections
      x-implementation-status: planned
      description: Planned. Requires current connection eligibility and configured step-up. Captures approved consent,
        creates one durable connection intent and returns an allowlisted partner-hosted handoff. Backend-verifiable
        callback and ownership evidence are required before connected state. Membership multiplicity follows OD-13,
        with no implicit policy default.
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '202':
          description: Durably accepted or awaiting an authoritative outcome. Pending/unknown is not financial completion.
            Poll the returned owned operation; do not blindly resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOperation'
          headers:
            Location:
              description: Owned operation or resource status URI under /api/v2.
              schema:
                type: string
                format: uri-reference
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
