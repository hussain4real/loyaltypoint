name: CI

on:
  pull_request:
    branches:
      - dev
      - stage
  push:
    branches:
      - dev
      - stage

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, dom, xml, xmlwriter, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Generate test application key
        run: php artisan key:generate --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run test suite
        run: composer test

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  mysql-foundations:
    name: MySQL foundations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pull2spend_test
          MYSQL_USER: test_app
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pull2spend_test
      DB_USERNAME: test_app
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, xml, xmlwriter, fileinfo
          coverage: none
          tools: composer:v2
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generate test application key
        run: php artisan key:generate --no-interaction
      - name: Allow the disposable migration user to create audit triggers
        run: docker exec -e MYSQL_PWD=test-only-root-password ${{ job.services.mysql.id }} mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1;'
      - name: Run compatibility and foundation suite on MySQL
        run: composer test
      - name: Run concurrent workers against disposable MySQL database
        run: php artisan test --compact tests/Feature/Services/FoundationConcurrencyTest.php
        env:
          FOUNDATION_CONCURRENCY_DRIVER: mysql
          FOUNDATION_CONCURRENCY_DATABASE: pull2spend_test

  contracts:
    name: API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated contract validator
        run: |
          python3 -m venv /tmp/pull2spend-contract-validator
          /tmp/pull2spend-contract-validator/bin/pip install --disable-pip-version-check openapi-spec-validator==0.7.2
      - name: Validate OpenAPI 3.1 contract
        run: /tmp/pull2spend-contract-validator/bin/openapi-spec-validator --schema 3.1 docs/pull2spend-v2.openapi.yaml
